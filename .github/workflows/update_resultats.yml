name: Mise à jour résultats CDM 2026

on:
  schedule:
    # Toutes les 5 minutes (minimum GitHub Actions)
    - cron: '*/5 * * * *'
  # Déclenchement manuel depuis l'onglet Actions sur GitHub
  workflow_dispatch:

# Empêche deux runs simultanés (si un job prend > 5 min)
concurrency:
  group: update-resultats
  cancel-in-progress: false

# Push résultats.js dans le dépôt
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-playwright-${{ runner.os }}

      - name: Install playwright
        run: pip install playwright

      - name: Install Chromium
        # Toujours réinstaller le navigateur (évite les mismatch version/cache)
        run: playwright install --with-deps chromium

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch et mise à jour résultats
        env:
          PYTHONIOENCODING: utf-8
        run: python fetch_resultats.py --all --no-wa
