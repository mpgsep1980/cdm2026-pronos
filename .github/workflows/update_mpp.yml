name: Mise à jour pronos MPP CDM 2026

on:
  # Déclenchement externe uniquement (cf. update_resultats.yml) : un service de
  # cron externe appelle l'API workflow_dispatch de ce workflow à intervalle
  # régulier plutôt que de dépendre du `schedule:` natif de GitHub Actions.
  workflow_dispatch:

concurrency:
  group: update-mpp
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-playwright-${{ runner.os }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium + xvfb
        run: |
          playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      # Le token capturé est mis en cache d'un run à l'autre pour éviter de se
      # reconnecter à chaque fois (login réel seulement si le token est absent
      # ou expiré — fetch_mpp.py gère déjà cette logique tout seul).
      - name: Restaurer le token MPP en cache
        uses: actions/cache/restore@v4
        with:
          path: mpp_token.txt
          key: mpp-token-${{ github.run_id }}
          restore-keys: |
            mpp-token-

      - name: Écrire les identifiants MPP
        run: |
          cat > mpp_credentials.json << EOF
          {"email": "${{ secrets.MPP_EMAIL }}", "password": "${{ secrets.MPP_PASSWORD }}"}
          EOF

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch et mise à jour pronos MPP
        env:
          PYTHONIOENCODING: utf-8
        run: xvfb-run -a python fetch_mpp.py

      - name: Sauvegarder le token MPP en cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: mpp_token.txt
          key: mpp-token-${{ github.run_id }}
